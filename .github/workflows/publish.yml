name: Publish

# Publishes to the VS Code Marketplace with Trusted Publishing (OIDC) — no
# VSCE_PAT secret. Runs when a version tag is pushed (git tag v0.5.1 && git
# push origin v0.5.1), or by hand from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # No dependency cache in the job that publishes: a poisoned cache
          # would end up in the release.
          package-manager-cache: false
      - run: npm ci

      # test/range-plugin.test.js prefers .venv/bin/ansible-playbook over the
      # runner image's own Ansible, so the range plugin is tested against a
      # pinned, known ansible-core rather than whatever the image ships.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install the tested ansible-core into .venv
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet 'ansible-core~=2.22.0'
          .venv/bin/ansible-playbook --version

      # A tag must name the version package.json carries — a Marketplace
      # version number can never be reused.
      - name: Check tag matches package.json version
        if: github.ref_type == 'tag'
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - run: npm run check
      - run: npm run package
      - name: Publish to the VS Code Marketplace
        run: |
          version="$(node -p 'require("./package.json").version')"
          npx vsce publish --oidc --packagePath "dist/playbook-runner-${version}.vsix"
